# Local development services (plan P0-INF-01). Start with: pnpm infra:up
name: gukirana

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gukirana
      POSTGRES_PASSWORD: gukirana
      POSTGRES_DB: gukirana
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gukirana"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gukirana
      MINIO_ROOT_PASSWORD: gukirana-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  unleash:
    image: unleashorg/unleash-server:latest
    environment:
      DATABASE_URL: postgres://gukirana:gukirana@postgres:5432/unleash
      DATABASE_SSL: "false"
    ports: ["4242:4242"]
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports: ["3300:3000", "4317:4317", "4318:4318"]

volumes:
  pgdata:
  minio:
